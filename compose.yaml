services:
  mars-colony:
    image: mars-colony:local
    build:
      context: .
    ports:
      - "${MARS_PORT:-8000}:8000"
    environment:
      DATA_DIR: /data
      STATIC_DIR: /app/static
      MARS_ALLOWED_ORIGINS: ${MARS_ALLOWED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      MARS_SECURE_COOKIE: ${MARS_SECURE_COOKIE:-false}
    volumes:
      - mars-data:/data
    restart: unless-stopped
    init: true
    stop_grace_period: 20s

volumes:
  mars-data:
