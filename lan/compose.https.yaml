# Standalone LAN deployment: docker compose --project-directory . -f lan/compose.https.yaml ...
name: mars-colony

services:
  server:
    image: mars-colony-server:local
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATA_DIR: /data
      MARS_ALLOWED_ORIGINS: ${MARS_HTTPS_ALLOWED_ORIGINS:-https://localhost:8443,https://127.0.0.1:8443}
      MARS_SECURE_COOKIE: "true"
      MARS_PLANET_RADIUS: ${MARS_PLANET_RADIUS:-30}
      MARS_PLANET_SUBDIVISIONS: ${MARS_PLANET_SUBDIVISIONS:-3}
      MARS_AI_URL: ${MARS_AI_URL:-http://host.docker.internal:11434}
      MARS_AI_MODEL: ${MARS_AI_MODEL:-qwen3.5:2b}
      MARS_AI_CONTEXT: ${MARS_AI_CONTEXT:-32768}
    volumes:
      - mars-data:/data
    networks:
      - backend
      - lan
    extra_hosts:
      # On Linux/WSL this maps Ollama on the Docker host into the container.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    init: true
    stop_grace_period: 20s

  client:
    image: mars-colony-client:local
    pull_policy: never
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "${MARS_HTTPS_PORT:-8443}:443"
    networks:
      - backend
      - lan
    volumes:
      - ./client/nginx.https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs/server.crt:/etc/nginx/tls/server.crt:ro
      - ./certs/server.key:/etc/nginx/tls/server.key:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

networks:
  backend:
    # FastAPI has no external route; only Nginx can reach it.
    internal: true
  # Docker Desktop needs a regular bridge to publish the HTTPS port to the LAN.
  # Disconnect the router WAN for full host/browser autonomy during the demo.
  lan:

volumes:
  mars-data:
