name: mars-colony

services:
  server:
    image: mars-colony-server:local
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATA_DIR: /data
      MARS_ALLOWED_ORIGINS: ${MARS_ALLOWED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      MARS_SECURE_COOKIE: ${MARS_SECURE_COOKIE:-false}
      MARS_PLANET_RADIUS: ${MARS_PLANET_RADIUS:-30}
      MARS_PLANET_SUBDIVISIONS: ${MARS_PLANET_SUBDIVISIONS:-3}
      MARS_AI_URL: ${MARS_AI_URL:-http://host.docker.internal:11435}
      MARS_AI_MODEL: ${MARS_AI_MODEL:-qwen3.5:27b-q4_K_M}
      MARS_AI_CONTEXT: ${MARS_AI_CONTEXT:-32768}
      MARS_CONTENT_DIR: /app/content
    volumes:
      - mars-data:/data
    restart: unless-stopped
    init: true
    stop_grace_period: 20s

  client:
    image: mars-colony-client:local
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "${MARS_PORT:-8000}:80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mars-data:
