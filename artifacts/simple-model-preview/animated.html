<div id="ui">Ветрогенератор и робот <button id="idle">Ожидание</button><button id="walk">Ходьба</button><button id="build">Строительство</button><button id="wave">Приветствие</button><button id="jump">Прыжок</button><button id="pause">Пауза</button></div>
<script type="module">
import * as T from 'three';
import {GLTFExporter} from '../../client/node_modules/three/examples/jsm/exporters/GLTFExporter.js';

import {OrbitControls} from '../../client/node_modules/three/examples/jsm/controls/OrbitControls.js';
const scene=new T.Scene();scene.background=new T.Color('#eef2f6');
const camera=new T.PerspectiveCamera(35,innerWidth/innerHeight,.1,100);camera.position.set(6,4.5,10);
const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);document.body.append(renderer.domElement);

scene.add(new T.HemisphereLight(0xffffff,0x667788,2));const light=new T.DirectionalLight(0xffffff,2.5);light.position.set(3,8,5);scene.add(light);
const colors={white:0xd1ccc0,orange:0xef6a15,gray:0x303840,dark:0x10151b,blue:0x168eee};
// One embedded, hand-painted-style atlas shared by every part.
const atlas=document.createElement('canvas');atlas.width=1024;atlas.height=1024;
const ctx=atlas.getContext('2d');const keys=Object.keys(colors);let rng=721;
function random(){rng=(Math.imul(rng,1664525)+1013904223)>>>0;return rng/4294967296;}
for(let tile=0;tile<keys.length;tile++){
 const key=keys[tile],x=(tile%4)*256,y=Math.floor(tile/4)*256;

 for(let n=0;n<1400;n++){const v=random()>.5?255:0;ctx.fillStyle=`rgba(${v},${v},${v},${.015+random()*.045})`;ctx.fillRect(x+random()*256,y+random()*256,1+random()*3,1+random()*3);}
 ctx.strokeStyle='rgba(0,0,0,.22)';ctx.lineWidth=4;ctx.strokeRect(x+9,y+9,238,238);
 ctx.strokeStyle='rgba(255,255,255,.22)';ctx.lineWidth=2;ctx.strokeRect(x+14,y+14,228,228);
 if(key==='white'||key==='orange'){
  for(const dx of [23,233])for(const dy of [23,233]){ctx.fillStyle='#515961';ctx.beginPath();ctx.arc(x+dx,y+dy,4,0,Math.PI*2);ctx.fill();}
  for(let n=0;n<18;n++){ctx.strokeStyle='rgba(230,235,238,.25)';ctx.lineWidth=1;const sx=x+18+random()*220,sy=y+18+random()*220;ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+2+random()*12,sy+random()*3);ctx.stroke();}
 }
 if(key==='blue'){ctx.fillStyle='rgba(180,245,255,.3)';for(let dy=20;dy<240;dy+=12)ctx.fillRect(x+18,y+dy,220,2);}
}
const compactAtlas=document.createElement('canvas');compactAtlas.width=256;compactAtlas.height=256;
const compactContext=compactAtlas.getContext('2d');compactContext.imageSmoothingEnabled=true;compactContext.imageSmoothingQuality='high';compactContext.drawImage(atlas,0,0,256,256);
const atlasTexture=new T.CanvasTexture(compactAtlas);atlasTexture.colorSpace=T.SRGBColorSpace;
const atlasMaterial=new T.MeshStandardMaterial({map:atlasTexture,roughness:.72,metalness:.12});
const materials=Object.fromEntries(keys.map(k=>[k,atlasMaterial]));
function applyAtlasUV(geo,key){
 const p=geo.attributes.position;const uv=[];const tile=keys.indexOf(key),tx=(tile%4)*256,ty=Math.floor(tile/4)*256;
 // Project each triangle along its dominant face normal; retain a texel gutter.
 const normal=geo.attributes.normal;const bounds=geo.boundingBox;
 for(let i=0;i<p.count;i++){
  const n=[Math.abs(normal.getX(i)),Math.abs(normal.getY(i)),Math.abs(normal.getZ(i))];const drop=n.indexOf(Math.max(...n));const axes=[0,1,2].filter(a=>a!==drop);
  const pos=[p.getX(i),p.getY(i),p.getZ(i)],lo=bounds.min.toArray(),hi=bounds.max.toArray();
  const u=(pos[axes[0]]-lo[axes[0]])/Math.max(hi[axes[0]]-lo[axes[0]],.00001),v=(pos[axes[1]]-lo[axes[1]])/Math.max(hi[axes[1]]-lo[axes[1]],.00001);

}
function pivot(root,name,p){const g=new T.Group();g.name=name;g.position.set(...p);root.add(g);return g}
function quatTrack(name,axis,times,angles){const values=[];for(const a of angles)values.push(...new T.Quaternion().setFromAxisAngle(new T.Vector3(...axis),a).toArray());return new T.QuaternionKeyframeTrack(name+'.quaternion',times,values)}
async function build(name){
 const data=await (await fetch('../../assets/models/energy-v2/'+name+'.parts.json')).json();
 const root=new T.Group();root.name=name;let rotor,head,la,ra,ll,rl;
 if(name==='wind-turbine')rotor=pivot(root,'Rotor',[0,2.75,.63]);
 else if(name==='robot-minion'){head=pivot(root,'Head',[0,1.56,0]);la=pivot(root,'LeftArm',[-.62,1.5,0]);ra=pivot(root,'RightArm',[.62,1.5,0]);ll=pivot(root,'LeftLeg',[-.25,.8,0]);rl=pivot(root,'RightLeg',[.25,.8,0]);}
 for(const part of data.parts){const points=[];let mat;for(const [m,f] of part.faces){mat=m;for(let i=1;i<f.length-1;i++)for(const idx of [f[0],f[i],f[i+1]]){const [x,y,z]=data.vertices[idx-1];points.push(x,z,-y)}}
 const geo=new T.BufferGeometry();geo.setAttribute('position',new T.Float32BufferAttribute(points,3));geo.computeVertexNormals();geo.computeBoundingBox();const mid=geo.boundingBox.getCenter(new T.Vector3());let parent=root;
 if(rotor&&['blade','hub','hub_cap'].includes(part.name))parent=rotor;

 else if(part.name.startsWith('arm')||['wrist','gripper'].includes(part.name))parent=mid.x<0?la:ra;
 else if(part.name.startsWith('leg')||part.name.startsWith('foot')||part.name==='knee')parent=mid.x<0?ll:rl;}

 }
 const times=[0,.3,.6,.9,1.2];let clips;
 if(rotor)clips=[new T.AnimationClip('Spin',2,[quatTrack('Rotor',[0,0,1],[0,.5,1,1.5,2],[0,Math.PI/2,Math.PI,Math.PI*1.5,Math.PI*2])])];
 else clips=[new T.AnimationClip('Idle',3,[quatTrack('Head',[0,1,0],[0,.75,1.5,2.25,3],[0,.15,0,-.15,0])]),new T.AnimationClip('Walk',1.2,[...['LeftArm','RightArm','LeftLeg','RightLeg'].map((n,i)=>quatTrack(n,[1,0,0],times,[0,.42,0,-.42,0].map(a=>a*([1,-1,-1,1][i]))))])];
 if(!head&&!rotor)clips=[];
 if(head){
  const children=[...root.children];const motion=pivot(root,'RobotMotion',[0,0,0]);for(const child of children)motion.add(child);
  const bt=[0,.25,.5,.7,.95,1.15,1.4,1.65,1.9,2.2];
  clips.push(new T.AnimationClip('Build',2.2,[
   quatTrack('RightArm',[1,0,0],bt,[0,-1.8,-.8,-1.8,-.8,-1.8,-.8,-1.8,-.8,0]),
   quatTrack('LeftArm',[1,0,0],bt,[0,-.9,-.9,-.9,-.9,-.9,-.9,-.9,-.9,0]),
   quatTrack('Head',[1,0,0],bt,[0,.22,.22,.22,.22,.22,.22,.22,.22,0])
  ]));
  const wt=[0,.35,.65,.95,1.25,1.55,1.85,2.2];
  clips.push(new T.AnimationClip('Wave',2.2,[
   quatTrack('RightArm',[0,0,1],wt,[0,2.35,2.8,2.2,2.8,2.2,2.35,0]),
   quatTrack('Head',[0,0,1],wt,[0,-.1,-.1,-.1,-.1,-.1,-.1,0])
  ]));
  const jt=[0,.2,.35,.65,.95,1.1,1.4];
  clips.push(new T.AnimationClip('Jump',1.4,[
   new T.VectorKeyframeTrack('RobotMotion.position',jt,[0,0,0,0,0,0,0,.2,0,0,.85,0,0,.2,0,0,0,0,0,0,0]),
   new T.VectorKeyframeTrack('RobotMotion.scale',jt,[1,1,1,1.06,.88,1.06,.97,1.04,.97,1,1,1,.97,1.04,.97,1.06,.88,1.06,1,1,1]),
   quatTrack('LeftArm',[0,0,1],jt,[0,.2,-.45,-.7,-.45,.2,0]),
   quatTrack('RightArm',[0,0,1],jt,[0,-.2,.45,.7,.45,-.2,0])
  ]));
 }
 const binary=await new GLTFExporter().parseAsync(root,{binary:true,animations:clips});
 // Verify the actual exported asset, and display the re-imported version.
 const gltf=await new GLTFLoader().parseAsync(binary,'');if(gltf.animations.length!==clips.length)throw Error('Missing clips');
 // Sample every exported clip, checking node bindings and finite transforms.
 const check=new T.AnimationMixer(gltf.scene);const stats=[];
 for(const clip of gltf.animations){check.stopAllAction();check.clipAction(clip).play();check.setTime(clip.duration*.46);gltf.scene.updateMatrixWorld(true);gltf.scene.traverse(n=>{if(!n.matrixWorld.elements.every(Number.isFinite))throw Error('Invalid transform: '+n.name)});stats.push({name:clip.name,duration:clip.duration,tracks:clip.tracks.length});}
 check.stopAllAction();window.clipReport=window.clipReport||{};window.clipReport[name]=stats;
 return {binary,root:gltf.scene,clips:gltf.animations};
}
window.atlasPNG=compactAtlas.toDataURL('image/png');window.exports={};const mixers=[];let robot,paused=false;
for(const [i,name] of ['wind-turbine','robot-minion'].entries()){const b=await build(name);window.exports[name]=Array.from(new Uint8Array(b.binary));b.root.position.x=i?2:-2;scene.add(b.root);const mixer=new T.AnimationMixer(b.root);mixers.push(mixer);mixer.clipAction(b.clips[0]).play();if(i)robot={mixer,clips:b.clips};}
window.selectRobotClip=(name,time)=>{robot.mixer.stopAllAction();const clip=robot.clips.find(c=>c.name.toLowerCase()===name);const action=robot.mixer.clipAction(clip).reset();if(['wave','jump'].includes(name)){action.setLoop(T.LoopOnce,1);action.clampWhenFinished=true;}action.play();if(time!==undefined){paused=true;robot.mixer.setTime(time);}};

const solar=await build('solar-panel');window.exports['solar-panel']=Array.from(new Uint8Array(solar.binary));

</script>
